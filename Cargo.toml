[package]
name = "yy_dps"
version = "0.1.0"
edition = "2024"

[dependencies]
makepad-widgets ={ git = "https://github.com/makepad/makepad",branch = "dev"}
toml = "0.9.2"
serde = { version = "1.0.219", features = ["derive"] }
tokio = { version = "1.46.1", features = ["full"] }
tokio-util = { version = "0.7.9", features = ["net", "compat"] }
chrono = { version = "0.4.41" }
tiberius = { version = "0.12.2", features = [
    "chrono",
    "tds73",
    "native-tls",
], default-features = false }
anyhow = "1.0.97"
thiserror = {version = "2.0.12"}
umya-spreadsheet = "2.3.0"
rayon = "1.10.0"
rfd ={ version = "0.15.3"}
rand = { version = "0.9.1"}
rand_distr = {version = "0.5.1"}
futures = {version = "0.3.31"}
regex ={ version = "1.10.0"}


[profile.release]
codegen-units = 16